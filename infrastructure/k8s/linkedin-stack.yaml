apiVersion: v1
kind: Namespace
metadata:
  name: linkedin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: linkedin-config
  namespace: linkedin
data:
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: linkedin_ds
  MYSQL_USER: appuser
  MONGO_HOST: mongodb
  MONGO_PORT: "27017"
  MONGO_DATABASE: linkedin_ds_logs
  MONGO_USER: appuser
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  KAFKA_BROKER: kafka:9092
  GROQ_BASE_URL: https://api.groq.com/openai/v1
  GROQ_MODEL: llama-3.3-70b-versatile
  LLM_MODEL: llama-3.3-70b-versatile
  AI_INLINE_FALLBACK: "true"
  CAREER_COACH_USE_LLM: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: linkedin-secrets
  namespace: linkedin
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: CHANGE_ME_ROOT_PASSWORD
  MYSQL_PASSWORD: CHANGE_ME_APP_PASSWORD
  MONGO_PASSWORD: CHANGE_ME_MONGO_PASSWORD
  JWT_SECRET: CHANGE_ME_JWT_SECRET
  GROQ_API_KEY: CHANGE_ME_GROQ_API_KEY
  OPENAI_API_KEY: CHANGE_ME_OPENAI_KEY
  ANTHROPIC_API_KEY: CHANGE_ME_ANTHROPIC_KEY
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: linkedin
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: YOUR_ECR_REPO/mysql:latest
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: linkedin-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: linkedin-secrets
                  key: MYSQL_PASSWORD
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 20
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: mysql-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: linkedin
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: linkedin
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: YOUR_ECR_REPO/mongodb:latest
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: MONGO_USER
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: linkedin-secrets
                  key: MONGO_PASSWORD
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: MONGO_DATABASE
          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: mongodb-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: linkedin
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: linkedin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: linkedin
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: linkedin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.0
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: linkedin
spec:
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: linkedin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: zookeeper:2181
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: linkedin
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: linkedin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: local
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: kafka:9092
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: linkedin
spec:
  selector:
    app: kafka-ui
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: linkedin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: platform-api
  template:
    metadata:
      labels:
        app: platform-api
    spec:
      containers:
        - name: platform-api
          image: YOUR_ECR_REPO/platform-api:latest
          ports:
            - containerPort: 3000
          env:
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: MYSQL_HOST
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: MYSQL_PORT
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: linkedin-secrets
                  key: MYSQL_PASSWORD
            - name: MONGO_HOST
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: MONGO_HOST
            - name: MONGO_PORT
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: MONGO_PORT
            - name: MONGO_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: MONGO_DATABASE
            - name: MONGO_USER
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: MONGO_USER
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: linkedin-secrets
                  key: MONGO_PASSWORD
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: REDIS_PORT
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: KAFKA_BROKER
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: linkedin-secrets
                  key: JWT_SECRET
            - name: AI_AGENT_URL
              value: http://ai-agent-service:8000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: linkedin
spec:
  selector:
    app: platform-api
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-service
  namespace: linkedin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent-service
  template:
    metadata:
      labels:
        app: ai-agent-service
    spec:
      containers:
        - name: ai-agent-service
          image: YOUR_ECR_REPO/ai-agent-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: KAFKA_BROKER
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: REDIS_HOST
            - name: PROFILE_SERVICE_URL
              value: http://platform-api:3000
            - name: JOB_SERVICE_URL
              value: http://platform-api:3000
            - name: APPLICATION_SERVICE_URL
              value: http://platform-api:3000
            - name: MONGO_HOST
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: MONGO_HOST
            - name: MONGO_PORT
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: MONGO_PORT
            - name: MONGO_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: MONGO_DATABASE
            - name: MONGO_USER
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: MONGO_USER
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: linkedin-secrets
                  key: MONGO_PASSWORD
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: linkedin-secrets
                  key: GROQ_API_KEY
            - name: GROQ_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: GROQ_BASE_URL
            - name: GROQ_MODEL
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: GROQ_MODEL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: linkedin-secrets
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: linkedin-secrets
                  key: ANTHROPIC_API_KEY
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: LLM_MODEL
            - name: CAREER_COACH_USE_LLM
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: CAREER_COACH_USE_LLM
            - name: AI_INLINE_FALLBACK
              valueFrom:
                configMapKeyRef:
                  name: linkedin-config
                  key: AI_INLINE_FALLBACK
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent-service
  namespace: linkedin
spec:
  selector:
    app: ai-agent-service
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: linkedin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: YOUR_ECR_REPO/client:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: linkedin
spec:
  selector:
    app: client
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkedin-ingress
  namespace: linkedin
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 80
